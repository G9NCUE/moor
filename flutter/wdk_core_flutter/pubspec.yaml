name: wdk_core_flutter
description: "WDK from Flutter over the JSON-RPC transport. Proof of concept; see ../../docs/flutter-poc.md"
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.11.5
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: to.moor.wdk_core_flutter
        pluginClass: WdkCoreFlutterPlugin
